name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    # upstream-sync creates a PR after it already built the same branch, then
    # merges and deletes that branch immediately. Letting the PR trigger a
    # second build only produces a startup failure once the branch is gone.
    # A PR that changes Android/scripts still runs the normal CI.
    paths-ignore:
      - "upstream/**"
      - "UPSTREAM_VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      abis: arm64-v8a
      # master pushes validate the release variant too; PRs use debug for speed.
      release: ${{ github.event_name == 'push' }}
      version: auto