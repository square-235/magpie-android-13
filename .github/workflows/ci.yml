name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      abis: arm64-v8a
      # master pushes validate the release variant too; PRs use debug for speed.
      release: ${{ github.event_name == 'push' }}
      version: auto