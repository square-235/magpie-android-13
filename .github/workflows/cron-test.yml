name: cron-test

# 临时诊断 workflow：确认这个仓库的 schedule 到底会不会触发。
# GitHub 定时任务的最短间隔是 5 分钟，*/2 无效，所以这里用 */5。
# 验证完请删除本文件。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report trigger
        run: |
          echo "triggered at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"