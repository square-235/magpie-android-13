name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to check out; defaults to the caller's ref.
        required: false
        type: string
        default: ""
      abis:
        description: Space-separated Android ABIs.
        required: false
        type: string
        default: arm64-v8a
      release:
        description: Build the release variant instead of debug.
        required: false
        type: boolean
        default: false
      version:
        description: Version to build; "auto" reads the tag from UPSTREAM_VERSION.
        required: false
        type: string
        default: auto
      upload_artifact:
        description: Upload the APK as a workflow artifact.
        required: false
        type: boolean
        default: true
    secrets:
      # Optional: when absent the build falls back to Gradle's automatic
      # debug key, which is fine for throwaway APKs but produces a different
      # certificate on every runner, so such APKs cannot update each other.
      ANDROID_KEYSTORE_BASE64:
        description: Base64 of the signing keystore (PKCS12 or JKS).
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: Password of the signing keystore.
        required: false
      ANDROID_KEY_ALIAS:
        description: Alias of the signing key inside that keystore.
        required: false
      ANDROID_KEY_PASSWORD:
        description: Password of that key (PKCS12 usually equals the store password).
        required: false
    outputs:
      apk_name:
        description: File name of the packaged APK.
        value: ${{ jobs.build.outputs.apk_name }}
      version:
        description: Numeric version the gateway and APK were stamped with.
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: Tag form of the version, with the leading v.
        value: ${{ jobs.build.outputs.tag }}
      sha:
        description: Commit the APK was built from.
        value: ${{ jobs.build.outputs.sha }}
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build; defaults to the selected ref.
        required: false
        type: string
        default: ""
      abis:
        description: Space-separated Android ABIs.
        required: false
        type: string
        default: arm64-v8a
      release:
        description: Build the release variant instead of debug.
        required: false
        type: boolean
        default: false
      version:
        description: Version to build; "auto" reads the tag from UPSTREAM_VERSION.
        required: false
        type: string
        default: auto
      upload_artifact:
        description: Upload the APK as a workflow artifact.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_name: ${{ steps.package.outputs.name }}
      version: ${{ steps.version.outputs.numeric }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # The secrets context is not available in a step-level "if", so the
          # presence check lives here. Without the secret the build simply
          # uses Gradle's automatic debug key.
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "No signing secret; using Gradle's debug key." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/magpie-keystore"
          echo "keystore=$RUNNER_TEMP/signing/magpie-keystore" >> "$GITHUB_OUTPUT"
          echo "- Signing keystore: decoded from secret" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: true
          cache-dependency-path: upstream/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools", but the "tools"
          # package no longer exists in current SDK repositories. Install
          # platform-tools here and the build packages explicitly below.
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: android/build/bun-cache
          key: bun-${{ runner.os }}-${{ hashFiles('upstream/internal/plugin/bun.go') }}

      - name: Check upstream compatibility
        run: bash scripts/check-upstream-compat.sh

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [[ -z "$raw" || "$raw" == "auto" ]]; then
            raw="$(sed -n 's/^tag=//p' UPSTREAM_VERSION 2>/dev/null | head -n 1)"
          fi
          if [[ -z "$raw" ]]; then
            echo "no version: UPSTREAM_VERSION has no tag" >&2
            exit 1
          fi
          numeric="${raw#v}"
          tag="v${numeric}"
          code="$(python3 -c 'import re,sys; m=re.match(r"^(\d+)\.(\d+)\.(\d+)", sys.argv[1]); a,b,c=map(int,m.groups()) if m else (0,0,1); print(min(a*10000000+b*1000000+c,2000000000))' "$numeric")"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### Version"
            echo ""
            echo "- Tag: \`$tag\`"
            echo "- versionName: \`$numeric\`"
            echo "- versionCode: \`$code\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        env:
          GOPROXY: https://proxy.golang.org,direct
          MAGPIE_VERSION_NAME: ${{ steps.version.outputs.numeric }}
          MAGPIE_VERSION_CODE: ${{ steps.version.outputs.code }}
          # Empty when the repository has no signing secrets: Gradle then
          # falls back to its automatic debug keystore.
          MAGPIE_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          MAGPIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAGPIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAGPIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME is not set}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_NDK_HOME="$SDK/ndk/28.2.13676358"
          if [[ ! -d "$ANDROID_NDK_HOME" ]]; then
            echo "NDK r28c is missing at $ANDROID_NDK_HOME" >&2
            exit 1
          fi
          args=(--abis "${{ inputs.abis }}" --version "${{ steps.version.outputs.numeric }}")
          if [[ "${{ inputs.release }}" == "true" ]]; then
            args+=(--release)
          fi
          ./scripts/build-apk.sh "${args[@]}"

      - name: Verify and package APK
        id: package
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME is not set}}"
          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [[ ! -f "$APK" ]]; then
            echo "Gradle finished but no APK was found" >&2
            exit 1
          fi
          AAPT2="$(find "$SDK/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [[ ! -x "$AAPT2" ]]; then
            echo "aapt2 not found under $SDK/build-tools" >&2
            exit 1
          fi
          BADGING="$("$AAPT2" dump badging "$APK")"
          grep -q "minSdkVersion:'33'" <<<"$BADGING" || {
            echo "APK does not declare minSdkVersion 33" >&2
            exit 1
          }
          grep -q "targetSdkVersion:'36'" <<<"$BADGING" || {
            echo "APK does not declare targetSdkVersion 36" >&2
            exit 1
          }

          ENTRIES="$(unzip -l "$APK")"
          for abi in ${{ inputs.abis }}; do
            case "$BADGING" in
              *"$abi"*) ;;
              *) echo "APK lacks native code for $abi" >&2; exit 1 ;;
            esac
            for so in libmagpie.so libmagpiebun.so; do
              case "$ENTRIES" in
                *"lib/$abi/$so"*) ;;
                *) echo "APK lacks lib/$abi/$so" >&2; exit 1 ;;
              esac
            done
          done

          VERSION="${{ steps.version.outputs.numeric }}"
          SAFE_VERSION="$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9._-]/-/g')"
          ABI_LABEL="$(printf '%s' "${{ inputs.abis }}" | tr ' ' '_')"
          APK_NAME="magpie-android-${SAFE_VERSION}-${ABI_LABEL}.apk"
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" > "dist/$APK_NAME.sha256"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner not found under $SDK/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" --version || true
          # Parse defensively: the digest line varies between build-tools
          # versions, and an anchored match produced an empty value for a
          # correctly signed APK. The raw output also lands in the log.
          if ! SIGNER_OUT="$("$APKSIGNER" verify --print-certs "dist/$APK_NAME" 2>&1)"; then
            printf '%s\n' "$SIGNER_OUT" >&2
            echo "apksigner verify failed" >&2
            exit 1
          fi
          printf '%s\n' "$SIGNER_OUT"
          CERT="$(printf '%s\n' "$SIGNER_OUT" \
            | sed -n 's/.*SHA-256 digest: *//p' \
            | head -n 1 | tr -d '[:space:]')"
          if [[ -z "$CERT" ]]; then
            echo "warning: apksigner printed no SHA-256 digest" >&2
          fi
          echo "certificate=$CERT" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          {
            echo "### Android build"
            echo ""
            echo "- APK: \`$APK_NAME\`"
            echo "- Size: $(du -h "dist/$APK_NAME" | cut -f1)"
            echo "- SHA-256: \`$(cut -d' ' -f1 "dist/$APK_NAME.sha256")\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo "- ABIs: \`${{ inputs.abis }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: magpie-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14