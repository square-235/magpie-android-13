name: release

on:
  workflow_call:
    inputs:
      release:
        description: Create a GitHub release after a successful build.
        required: false
        type: boolean
        default: true
      upstream_tag:
        description: Upstream magpie tag this APK was synced from.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub release after a successful build.
        required: false
        type: boolean
        default: true
      upstream_tag:
        description: Upstream magpie tag this APK was synced from.
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: master
      abis: arm64-v8a
      release: true
      version: ${{ inputs.upstream_tag != '' && inputs.upstream_tag || format('master-{0}', github.run_number) }}
      upload_artifact: true

  release:
    name: Publish
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: magpie-apk
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          TITLE="magpie Android $TAG"
          if [[ -n "$UPSTREAM_TAG" ]]; then
            TITLE="$TITLE (upstream $UPSTREAM_TAG)"
          fi
          if [[ -z "$TARGET_SHA" ]]; then
            echo "build did not report the commit it built" >&2
            exit 1
          fi

          {
            echo "### Release"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Upstream: \`${UPSTREAM_TAG:-not recorded}\`"
            echo "- Assets:"
            ls -lh dist
          } >> "$GITHUB_STEP_SUMMARY"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" dist/*.apk dist/*.sha256 \
            --title "$TITLE" \
            --generate-notes \
            --target "$TARGET_SHA"